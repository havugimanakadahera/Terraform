parameters:
- name: envName
  type: string
- name: tfVersion
  type: string
- name: azureServiceConnection
  type: string

jobs:
- job: import_${{ parameters.envName }}
  displayName: "[${{ parameters.envName }}] Import → Validate → Drift Gate"
  pool:
    vmImage: ubuntu-latest

  variables:
    ENV_NAME: ${{ parameters.envName }}
    TFVARS_FILE: environments/${{ parameters.envName }}.tfvars

  steps:
  - checkout: self

  # ── Step 1: Install the required Terraform version ─────────────────────────
  - task: TerraformInstaller@1
    displayName: "Install Terraform ${{ parameters.tfVersion }}"
    inputs:
      terraformVersion: ${{ parameters.tfVersion }}

  # ── Step 2: Bootstrap remote state backend (idempotent) ────────────────────
  # Creates resource group, storage account, and blob container when missing.
  # Variable group tf-<env> must provide: TFSTATE_RESOURCE_GROUP,
  # TFSTATE_LOCATION, TFSTATE_STORAGE_ACCOUNT, TFSTATE_CONTAINER.
  - task: AzureCLI@2
    displayName: "Bootstrap remote state backend"
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        echo "Creating resource group (if not exists)..."
        az group create \
          --name "${TFSTATE_RESOURCE_GROUP}" \
          --location "${TFSTATE_LOCATION}" \
          --output none

        echo "Creating storage account (if not exists)..."
        az storage account create \
          --name "${TFSTATE_STORAGE_ACCOUNT}" \
          --resource-group "${TFSTATE_RESOURCE_GROUP}" \
          --location "${TFSTATE_LOCATION}" \
          --sku Standard_LRS \
          --kind StorageV2 \
          --output none

        STORAGE_KEY=$(az storage account keys list \
          --resource-group "${TFSTATE_RESOURCE_GROUP}" \
          --account-name "${TFSTATE_STORAGE_ACCOUNT}" \
          --query "[0].value" -o tsv)

        echo "Creating blob container (if not exists)..."
        az storage container create \
          --name "${TFSTATE_CONTAINER}" \
          --account-name "${TFSTATE_STORAGE_ACCOUNT}" \
          --account-key "${STORAGE_KEY}" \
          --output none

        # Persist storage key for subsequent steps via pipeline variable.
        echo "##vso[task.setvariable variable=STORAGE_KEY;issecret=true]${STORAGE_KEY}"

  # ── Step 3: terraform init ─────────────────────────────────────────────────
  - task: AzureCLI@2
    displayName: "terraform init ($(ENV_NAME))"
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        terraform init \
          -backend-config="resource_group_name=${TFSTATE_RESOURCE_GROUP}" \
          -backend-config="storage_account_name=${TFSTATE_STORAGE_ACCOUNT}" \
          -backend-config="container_name=${TFSTATE_CONTAINER}" \
          -backend-config="access_key=${STORAGE_KEY}" \
          -backend-config="key=$(ENV_NAME).tfstate"

  # ── Step 4: terraform validate ─────────────────────────────────────────────
  - task: AzureCLI@2
    displayName: "terraform validate"
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        terraform validate

  # ── Step 5: terraform apply (import phase, import_existing=true) ───────────
  # Discovers existing Azure resources, imports them into state.
  # Does NOT create or destroy anything — only re-attaches existing objects.
  - task: AzureCLI@2
    displayName: "terraform apply — import existing resources"
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        terraform apply -auto-approve \
          -var-file="$(TFVARS_FILE)" \
          -var="environment=$(ENV_NAME)" \
          -var="import_existing=true"

  # ── Step 6: Drift gate — plan must be clean after import ───────────────────
  # Runs plan with import_existing=false (import blocks inactive).
  # Exit code 0 = no changes  → pass
  # Exit code 2 = has changes → fail (resource would be recreated/modified)
  # Exit code 1 = plan error  → fail
  - task: AzureCLI@2
    displayName: "Drift gate — plan must show no changes"
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        set +e
        terraform plan -detailed-exitcode \
          -var-file="$(TFVARS_FILE)" \
          -var="environment=$(ENV_NAME)" \
          -var="import_existing=false"
        PLAN_EXIT=$?
        set -e

        if [ ${PLAN_EXIT} -eq 1 ]; then
          echo "##[error] terraform plan failed with an error."
          exit 1
        fi

        if [ ${PLAN_EXIT} -eq 2 ]; then
          echo "##[error] Plan shows changes after import."
          echo "##[error] This means the resource config differs from Azure reality."
          echo "##[error] Review the plan above and align variables or resource config."
          exit 2
        fi

        echo "##[section] Drift gate passed — no changes detected."

  # ── Step 7: Print state summary ────────────────────────────────────────────
  - task: AzureCLI@2
    displayName: "terraform state list — confirm imported resources"
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        echo "Resources now tracked in state for $(ENV_NAME):"
        terraform state list
